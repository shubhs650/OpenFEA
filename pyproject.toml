[project]
name = "openfea-dev"
version = "0.1.0"
description = "Local FEA development bootstrap; no numerical capabilities yet"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.13.1",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["services/api", "."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "services/api"
files = ["services/api/app", "scripts", "tests"]
