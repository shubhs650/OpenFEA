[project]
name = "openfea-dev"
version = "0.1.0"
description = "Local FEA prototype development tools and persistent project API"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.4",
  "alembic==1.20.0",
  "python-docx==1.2.0",
  "lxml==6.0.2",
]

[dependency-groups]
dev = [
  "httpx2==2.13.1",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["services/api", "services/worker", "."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "services/api:services/worker"
files = ["services/api/app", "services/worker/worker/runtime.py", "services/worker/worker/step_import.py", "services/worker/worker/cleanup.py", "services/worker/worker/resources.py", "services/worker/worker/resource_viewer.py", "services/worker/worker/geometry.py", "services/worker/worker/meshing.py", "services/worker/worker/deck.py", "services/worker/worker/benchmark.py", "services/worker/worker/calculix", "services/worker/worker/postprocess/tensors.py", "services/worker/worker/postprocess/fields.py", "services/worker/worker/stress_fixture.py", "services/worker/worker/bond_fixture.py", "scripts", "tests"]
